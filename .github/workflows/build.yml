name: Hygiene Tests

on:
  push:
    paths:
      - '**/*.rdf'
      - 'etc/scripts/*.py'
      - 'etc/scripts/requirements.txt'
      - 'etc/testing/hygiene_shapes/*.ttl'
      - '**/build*.yml'
  pull_request:
  workflow_dispatch:

jobs:
  hygiene-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (for the HermiT reasoner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          pip install -r ./etc/scripts/requirements.txt

      - name: Check Module IRIs
        run: |
          python etc/scripts/check_module_iris.py

      - name: Run Hygiene Tests
        if: success() || failure()
        run: |
          python etc/scripts/hygiene_runner.py AboutIOFDev.rdf AboutIOFProd.rdf
