name: Hygiene Tests

# Every job below runs in parallel: the module IRI check, hygiene once per About file,
# the competency runner's own unit tests, and one job per competency suite (HermiT can
# take minutes per suite, so each suite gets its own runner).
#
# The competency questions are in the private iofoundry/ontology-questions repository,
# checked out over etc/testing/competency/ with a read-only deploy key. Its secrets
# (ONTOLOGY_QUESTIONS_DEPLOY_KEY, COMPETENCY_CACHE_KEY) are in the `competency` environment,
# which only master, review/*, staging/* and releases/* may use: a workflow edited on any other branch
# cannot read them. The competency jobs therefore run only on pushes (and manual runs) on
# those branches; elsewhere, and on pull requests, they are skipped. This repository's logs
# and caches are public, so the runner runs with --redact and the entailment cache is
# encrypted. See etc/scripts/COMPETENCY.md.

on:
  push:
    paths:
      - '**/*.rdf'
      - 'catalog-v001.xml'
      - 'competency'
      - 'etc/scripts/**'
      - 'etc/testing/**'
      - '**/build*.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      questions-ref:
        description: Branch, tag or SHA of iofoundry/ontology-questions to run
        default: main

permissions:
  contents: read

jobs:
  module-iris:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r ./etc/scripts/requirements.txt
      - name: Check Module IRIs
        run: python etc/scripts/check_module_iris.py

  hygiene-tests:
    name: hygiene-tests (${{ matrix.about }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        about: [AboutIOFDev.rdf, AboutIOFProd.rdf]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Java (for the HermiT reasoner)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: pip install -r ./etc/scripts/requirements.txt
      - name: Run Hygiene Tests
        run: python etc/scripts/hygiene_runner.py ${{ matrix.about }}

  competency-runner-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Java (for the HermiT reasoner)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: pip install -r ./etc/scripts/requirements.txt
      - name: Unit tests for the competency runner
        run: python -m unittest discover -s etc/scripts/tests -t etc/scripts

  competency-suites:
    # Only branches the `competency` environment allows (its deployment-branch rule is what
    # protects the secrets; this condition just skips the jobs elsewhere instead of failing).
    if: >-
      github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/review/') || startsWith(github.ref, 'refs/heads/staging/') ||
      startsWith(github.ref, 'refs/heads/releases/'))
    environment: competency
    runs-on: ubuntu-latest
    env:
      HAS_QUESTIONS: ${{ secrets.ONTOLOGY_QUESTIONS_DEPLOY_KEY != '' }}
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check out competency questions
        if: env.HAS_QUESTIONS == 'true'
        uses: actions/checkout@v7
        with:
          repository: iofoundry/ontology-questions
          ref: ${{ inputs.questions-ref || 'main' }}
          ssh-key: ${{ secrets.ONTOLOGY_QUESTIONS_DEPLOY_KEY }}
          path: etc/testing/competency
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r ./etc/scripts/requirements.txt
      - name: List competency suites
        id: list
        run: |
          if [ "$HAS_QUESTIONS" != true ]; then
            echo "::notice title=Competency Tests::no ONTOLOGY_QUESTIONS_DEPLOY_KEY in the competency environment; competency tests skipped."
          fi
          echo "suites=$(./competency --list)" >> "$GITHUB_OUTPUT"

  competency-tests:
    name: competency (${{ matrix.suite }})
    needs: competency-suites
    if: needs.competency-suites.outputs.suites != '[]'
    environment: competency
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.competency-suites.outputs.suites) }}
    env:
      SUITE: ${{ matrix.suite }}
      HAS_CACHE_KEY: ${{ secrets.COMPETENCY_CACHE_KEY != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check out competency questions
        uses: actions/checkout@v7
        with:
          repository: iofoundry/ontology-questions
          ref: ${{ inputs.questions-ref || 'main' }}
          ssh-key: ${{ secrets.ONTOLOGY_QUESTIONS_DEPLOY_KEY }}
          path: etc/testing/competency
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Java (for the HermiT reasoner)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: pip install -r ./etc/scripts/requirements.txt
      # The entailed graph contains the private data and caches of this public repository
      # can be restored by pull requests from forks, so the cache holds only an encrypted
      # tarball. The runner keys its own cache on the suite's exact import closure and its
      # own code, so a restored but stale entry is simply re-entailed; this key only decides
      # when a new one is saved. Saved even when tests fail: the runner writes its cache
      # only after a successful entailment.
      - name: Restore entailment cache
        id: cache
        if: env.HAS_CACHE_KEY == 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/competency.enc
          key: competency-${{ matrix.suite }}-${{ hashFiles('**/*.rdf', 'catalog-v001.xml', 'etc/scripts/*.py', format('etc/testing/competency/{0}/**', matrix.suite)) }}
          restore-keys: competency-${{ matrix.suite }}-
      - name: Decrypt entailment cache
        if: steps.cache.outputs.cache-matched-key != ''
        env:
          CACHE_KEY: ${{ secrets.COMPETENCY_CACHE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:CACHE_KEY -in build/competency.enc | tar -x -C build \
            || { rm -rf build/competency; echo "::warning title=Competency cache::cannot decrypt the cached entailment; HermiT will run"; }
      - name: Run competency tests
        run: ./competency "$SUITE" --redact --summary-json build/competency-counts.json
      # Question counts and the suite name only (already in this public log), for the total.
      - name: Upload question counts
        if: always() && hashFiles('build/competency-counts.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: competency-counts-${{ strategy.job-index }}
          path: build/competency-counts.json
          retention-days: 7
      - name: Encrypt entailment cache
        if: always() && env.HAS_CACHE_KEY == 'true' && steps.cache.outputs.cache-hit != 'true'
        env:
          CACHE_KEY: ${{ secrets.COMPETENCY_CACHE_KEY }}
        run: |
          if [ -d build/competency ]; then
            tar -c -C build competency | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:CACHE_KEY -out build/competency.enc
          fi
      - name: Save entailment cache
        if: always() && env.HAS_CACHE_KEY == 'true' && steps.cache.outputs.cache-hit != 'true' && hashFiles('build/competency.enc') != ''
        uses: actions/cache/save@v6
        with:
          path: build/competency.enc
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # One table on the run's summary page totalling the questions run by every suite job.
  competency-summary:
    name: competency summary
    needs: [competency-suites, competency-tests]
    if: always() && needs.competency-tests.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r ./etc/scripts/requirements.txt
      - name: Download question counts
        uses: actions/download-artifact@v8
        with:
          pattern: competency-counts-*
          path: build/competency-counts
      - name: Total the questions
        env:
          SUITES: ${{ needs.competency-suites.outputs.suites }}
        run: |
          mkdir -p build/competency-counts
          python etc/scripts/competency_summary.py build/competency-counts "$SUITES" | tee -a "$GITHUB_STEP_SUMMARY"
